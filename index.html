<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Research discovery lab</title>
<meta name="description" content="A follow-along lab for setting up research profiles, author records, crawling checks and discovery tests. Everything stays in your browser.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#stations">Skip to the stations</a>
<main>
  <header class="masthead">
    <h1 id="title">Research discovery lab</h1>
    <p class="sub" id="subtitle"></p>
    <p class="permission" id="permission"></p>
  </header>

  <noscript>
    <p class="note">This lab builds its links from the details you type, so it needs JavaScript. The stations are also listed in the talk slides if you would rather work from those.</p>
  </noscript>

  <section class="panel" id="details-panel" aria-labelledby="details-h">
    <h2 id="details-h">Your details</h2>
    <p class="note" id="details-note"></p>
    <p class="dsum" id="details-summary" hidden></p>
    <p class="actions"><button type="button" id="details-toggle" aria-expanded="true" aria-controls="fields" hidden>Hide details</button></p>
    <div id="fields" class="fields"></div>
    <p class="actions" id="details-actions">
      <button type="button" id="clear">Clear my details</button>
      <span id="saved" class="saved" role="status"></span>
    </p>
  </section>

  <section class="panel progress" aria-labelledby="progress-h">
    <h2 id="progress-h">Progress</h2>
    <ol id="route" class="route" aria-label="The research discovery route"></ol>
    <p id="progress-text" role="status"></p>
    <p id="progress-next" class="nextline"></p>
    <p class="actions"><button type="button" id="copy">Copy my next steps</button> <span id="copied" class="saved" role="status"></span></p>
  </section>

  <div id="stations"></div>

  <footer class="foot">
    <section class="discussion" id="discussion-wrap" aria-labelledby="disc-h"></section>
    <p><a href="https://sgilson7.github.io/">Sam Gilson</a> · <a href="https://github.com/sgilson7/research-discovery-lab">Source</a></p>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
